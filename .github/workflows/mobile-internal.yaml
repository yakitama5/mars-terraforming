name: Mobile internal distribution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 配信するプラットフォーム（初期登録・署名設定の完了後に実行）
        type: choice
        options: [both, android, ios]
        default: both
        required: true

permissions:
  contents: read

# Serialize signing/upload as well as numbering. Retrying an old commit is refused.
concurrency:
  group: mobile-internal-distribution
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  FASTLANE_HIDE_CHANGELOG: 'true'
  FASTLANE_OPT_OUT_USAGE: 'true'
  BUNDLE_FROZEN: 'true'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
      android_build_number: ${{ steps.numbers.outputs.android_build_number }}
      ios_build_number: ${{ steps.numbers.outputs.ios_build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select configured platforms
        id: select
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform || 'both' }}
          MOBILE_ANDROID_ENABLED: ${{ vars.MOBILE_ANDROID_ENABLED }}
          MOBILE_IOS_ENABLED: ${{ vars.MOBILE_IOS_ENABLED }}
        run: python3 tools/mobile_cd.py select
      - name: Allocate retry-safe build numbers
        id: numbers
        run: python3 tools/mobile_cd.py numbers
      - name: Verify CD guardrails
        run: python3 -m unittest discover -s tools -p mobile_cd_test.py
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4.11'
          bundler: '4.0.16'
          bundler-cache: true
      - name: Verify pinned fastlane options and signing scope
        run: bundle exec ruby tools/mobile_cd_fastlane_test.rb
      - name: Explain inactive platforms
        if: steps.select.outputs.android != 'true' && steps.select.outputs.ios != 'true'
        run: echo 'ストアの初期登録・署名設定が未完了のため、モバイル配信は無効です。' >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: prepare
    if: needs.prepare.outputs.android == 'true' || needs.prepare.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: bash tools/check.sh

  android:
    needs: [prepare, checks]
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-internal
    permissions:
      contents: read
      id-token: write
    env:
      MOBILE_APP_IDENTIFIER: ${{ vars.MOBILE_APP_IDENTIFIER }}
      GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_BUILD_NUMBER: ${{ needs.prepare.outputs.android_build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check required settings and application ID
        run: python3 tools/mobile_cd.py materialize android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4.11'
          bundler: '4.0.16'
          bundler-cache: true
      - run: bundle exec ruby tools/mobile_cd_fastlane_test.rb
      - run: flutter pub get --enforce-lockfile
      - name: Build signed release bundle
        run: flutter build appbundle --release --no-pub --build-number="$ANDROID_BUILD_NUMBER" --dart-define=DEV_TOOLS=false
      - name: Refuse a superseded main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Authenticate to Google Play through WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Deploy and verify internal release
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: bundle exec fastlane android internal
      - name: Save verified distribution record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-internal-${{ needs.prepare.outputs.android_build_number }}
          path: build/mobile/android-release.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mars-mobile-signing"

  ios:
    needs: [prepare, checks]
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      MOBILE_APP_IDENTIFIER: ${{ vars.MOBILE_APP_IDENTIFIER }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      IOS_TESTFLIGHT_GROUP: ${{ vars.IOS_TESTFLIGHT_GROUP }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      IOS_BUILD_NUMBER: ${{ needs.prepare.outputs.ios_build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check required settings and Bundle ID
        run: python3 tools/mobile_cd.py materialize ios
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4.11'
          bundler: '4.0.16'
          bundler-cache: true
      - run: bundle exec ruby tools/mobile_cd_fastlane_test.rb
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - name: Install locked iOS dependencies
        working-directory: ios
        run: bundle exec pod install --deployment
      - name: Refuse a superseded main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Build, deploy and verify TestFlight internal group
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec fastlane ios internal
      - name: Save verified distribution record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-testflight-${{ needs.prepare.outputs.ios_build_number }}
          path: build/mobile/ios-release.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mars-mobile-signing"
